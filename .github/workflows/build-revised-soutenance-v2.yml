name: Build revised soutenance v2

on:
  push:
    branches:
      - soutenance-v2-fr-notes

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: soutenance-v2-fr-notes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pptxgenjs
        run: npm install --no-save pptxgenjs@3
      - name: Assemble and build deck
        run: |
          cat soutenance/.build/revised_v2_parts/part01.js \
              soutenance/.build/revised_v2_parts/part02.js \
              soutenance/.build/revised_v2_parts/part03.js \
              soutenance/.build/revised_v2_parts/part04.js > /tmp/build-soutenance.js
          sed -i "s#'/mnt/data/soutenance_joey_david_v2_revised_fr_notes.pptx'#require('path').resolve(process.cwd(),'soutenance/output/soutenance_joey_david_v2.pptx')#" /tmp/build-soutenance.js
          cp /tmp/build-soutenance.js ./build-soutenance-revised.js
          node ./build-soutenance-revised.js
      - name: Commit generated PowerPoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soutenance/output/soutenance_joey_david_v2.pptx build-soutenance-revised.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Revise soutenance v2 structure and French notes"
          git push origin soutenance-v2-fr-notes
