name: Import LaTeX soutenance source

on:
  push:
    branches:
      - soutenance-v2-fr-notes
    paths:
      - .github/workflows/import-latex-soutenance.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: soutenance-v2-fr-notes
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat soutenance/.latex-import/part-*.b64 | tr -d '\n' | base64 --decode > /tmp/soutenance_latex_source.zip
          rm -rf soutenance/latex
          mkdir -p soutenance/latex
          unzip -q /tmp/soutenance_latex_source.zip -d soutenance/latex
          test -f soutenance/latex/main.tex
          test -f soutenance/latex/notes.tex
          test -f soutenance/latex/references.bib
          test -f soutenance/latex/Makefile
          test -f soutenance/latex/README.md

      - name: Commit clean LaTeX source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf soutenance/.latex-import
          rm -f .github/workflows/import-latex-soutenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add LaTeX soutenance source"
          git push origin HEAD:soutenance-v2-fr-notes
