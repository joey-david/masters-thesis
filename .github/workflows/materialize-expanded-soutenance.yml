name: Materialize expanded soutenance

on:
  push:
    branches: [soutenance-v2-fr-notes]
    paths:
      - soutenance/latex/source_payload.b64
      - .github/workflows/materialize-expanded-soutenance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: soutenance-v2-fr-notes
          fetch-depth: 0

      - name: Recover and decode staged expanded source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, re, zlib

          root = Path('soutenance/latex')
          payload = root / 'source_payload.b64'
          s = re.sub(r'\s+', '', payload.read_text())
          candidates = []
          for trim in range(0, 65):
              t = s[:-trim] if trim else s
              if len(t) % 4 == 1:
                  continue
              try:
                  raw = base64.b64decode(t + '=' * ((-len(t)) % 4), validate=False)
                  dec = zlib.decompressobj(16 + zlib.MAX_WBITS)
                  tex = dec.decompress(raw) + dec.flush()
              except Exception:
                  continue
              ok = tex.lstrip().startswith(b'\\documentclass') and b'\\begin{document}' in tex and b'\\end{document}' in tex
              if ok:
                  candidates.append((len(tex), trim, tex))
          if not candidates:
              raise SystemExit('Could not recover a complete LaTeX document from source_payload.b64')
          _, trim, tex = max(candidates)
          (root / 'main.tex').write_bytes(tex)
          print('Recovered main.tex with', len(tex), 'bytes; trim=', trim)
          PY

      - name: Fetch canonical online background figures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soutenance/latex/assets /tmp/papers
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils imagemagick

          curl -L --retry 3 -o /tmp/papers/transformer.pdf https://papers.nips.cc/paper/7181-attention-is-all-you-need.pdf
          curl -L --retry 3 -o /tmp/papers/lora.pdf https://arxiv.org/pdf/2106.09685
          curl -L --retry 3 -o /tmp/papers/qlora.pdf https://arxiv.org/pdf/2305.14314
          curl -L --retry 3 -o soutenance/latex/assets/lora_hf_explainer.png \
            https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/peft/lora_diagram.png

          pdftoppm -f 3 -singlefile -png -r 200 /tmp/papers/transformer.pdf /tmp/transformer_page
          pdftoppm -f 1 -singlefile -png -r 200 /tmp/papers/lora.pdf /tmp/lora_page
          pdftoppm -f 3 -singlefile -png -r 200 /tmp/papers/qlora.pdf /tmp/qlora_page

          convert /tmp/transformer_page.png -crop 860x1250+440+120 +repage soutenance/latex/assets/transformer_vaswani_fig1.png
          convert /tmp/lora_page.png -crop 560x600+1010+1410 +repage soutenance/latex/assets/lora_hu_fig1.png
          convert /tmp/qlora_page.png -crop 1210x620+270+150 +repage soutenance/latex/assets/qlora_dettmers_fig1.png
          identify soutenance/latex/assets/*.png

      - name: Remove staging payload
        run: rm -f soutenance/latex/source_payload.b64

      - name: Commit materialized source and figures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A soutenance/latex
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Materialize expanded LaTeX soutenance and paper figures"
            git push origin HEAD:soutenance-v2-fr-notes
          fi
